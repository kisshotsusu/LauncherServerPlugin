<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudUpdate 启动器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 背景层 -->
  <div id="bg">
    <canvas id="bgSeq"></canvas>
  </div>

  <!-- 自绘标题栏 -->
  <header id="titlebar">
    <div class="brand">
      <div class="brandMark">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="lgBrand" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
              <stop stop-color="#67e8f9"/>
              <stop offset=".5" stop-color="#818cf8"/>
              <stop offset="1" stop-color="#e879f9"/>
            </linearGradient>
          </defs>
          <path d="M16 2l10 6v8c0 7-4.3 11.6-10 14C10.3 27.6 6 23 6 16V8l10-6z" fill="url(#lgBrand)" opacity=".92"/>
          <path d="M16 8l5 3.2v4.4c0 3.7-2.1 6-5 7.4-2.9-1.4-5-3.7-5-7.4v-4.4L16 8z" fill="#fff" opacity=".9"/>
          <circle cx="16" cy="15.4" r="2.2" fill="#1e293b"/>
        </svg>
      </div>
      <div class="brandText">
        <strong>CLOUD UPDATE</strong>
        <span>云端更新启动器</span>
      </div>
    </div>
    <div class="titlebarRight">
      <button id="btnRefresh" class="iconBtn refreshBtn" title="刷新状态">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M13.5 8a5.5 5.5 0 11-1.6-3.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M13.5 2.5v2.6h-2.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="btnSettings" class="settingsBtn" title="设置">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 5.2A2.8 2.8 0 108 10.8 2.8 2.8 0 008 5.2z" stroke="currentColor" stroke-width="1.3"/>
          <path d="M13.3 8.9l1.1.8-1.2 2.1-1.3-.5a5.7 5.7 0 01-1.2.7l-.2 1.4H7.5l-.2-1.4a5.7 5.7 0 01-1.2-.7l-1.3.5-1.2-2.1 1.1-.8a5.4 5.4 0 010-1.4L3.6 6.7l1.2-2.1 1.3.5a5.7 5.7 0 011.2-.7l.2-1.4H9l.2 1.4c.4.2.8.4 1.2.7l1.3-.5 1.2 2.1-1.1.8c.1.5.1.9 0 1.4z" stroke="currentColor" stroke-width="1.2"/>
        </svg>
        <span>设置</span>
      </button>
      <nav class="windowControls">
        <button id="btnWinMin" class="winBtn" title="最小化" aria-label="最小化">
          <svg viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <button id="btnWinMax" class="winBtn" title="最大化 / 还原" aria-label="最大化 / 还原">
          <svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <button id="btnWinClose" class="winBtn danger" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <!-- 主舞台 -->
  <main id="stage">
    <div id="versionOverlay" class="versionOverlay">
      <span>版本</span>
      <b id="localVersion">未知</b>
    </div>

    <section id="hero">
      <div class="heroCopy">
        <div class="eyebrow"><i></i> CLOUD UPDATE SYSTEM</div>
        <h1>星穹云启</h1>
        <p>跨越星海的每一次启程<br>皆由云端引擎为你护航</p>
      </div>
    </section>

    <section id="dock">
      <div class="actionCluster">
        <button id="btnLaunch" class="launchBtn" aria-label="启动游戏">
          <span class="launchIcon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5-11-6.5z" fill="currentColor"/></svg>
          </span>
          <span id="launchLabel" class="launchLabel">启动游戏</span>
          <span id="launchBadge" class="launchBadge hidden">0</span>
          <span class="launchShine"></span>
        </button>
        <div class="toolCluster">
          <button id="btnCancel" class="toolBtn cancelBtn hidden">取消</button>
          <div class="menuWrap">
            <button id="btnRepairMenu" class="toolBtn menuBtn">修复 · 目录 <span class="caret">▾</span></button>
            <div id="repairMenu" class="dropdownMenu" role="menu">
              <button class="menuItem" data-action="repair">完整性修复</button>
              <button class="menuItem" data-action="browse">选择游戏目录</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 设置面板 -->
  <aside id="settingsPanel" class="settingsPanel" aria-hidden="true">
    <header class="settingsHead">
      <h2>设置</h2>
      <button id="btnSettingsClose" class="iconBtn" aria-label="关闭设置">✕</button>
    </header>
    <form id="settingsForm">
      <label class="field">
        <span>游戏路径</span>
        <div class="pathRow">
          <input id="setGamePath" type="text" spellcheck="false" autocomplete="off">
          <button type="button" id="btnBrowse" class="miniBtn">浏览…</button>
        </div>
      </label>
      <label class="field">
        <span>服务器地址</span>
        <input id="setServerUrl" type="text" spellcheck="false" autocomplete="off">
      </label>
      <label class="field">
        <span>下载限速（KB/s，0 = 不限速）</span>
        <input id="setSpeed" type="number" min="0" step="1">
      </label>
      <label class="field">
        <span>背景序列帧目录（相对启动器）</span>
        <input id="setFrameDir" type="text" spellcheck="false" autocomplete="off">
      </label>
      <label class="field">
        <span>序列帧 FPS</span>
        <input id="setFps" type="number" min="1" step="1">
      </label>

      <label class="switchRow">
        <input id="setAutoCheck" type="checkbox">
        <span class="switchTrack"></span>
        <span class="switchLabel">启动时自动检查更新</span>
      </label>
      <label class="switchRow">
        <input id="setAutoRepair" type="checkbox">
        <span class="switchTrack"></span>
        <span class="switchLabel">启动时自动完整性修复</span>
      </label>

      <div class="settingsActions">
        <button type="button" id="btnSettingsCancel" class="miniBtn">取消</button>
        <button type="submit" class="miniBtn primary">保存设置</button>
      </div>
    </form>
  </aside>

  <div id="toasts" class="toasts"></div>

  <script src="app.js"></script>
</body>
</html>
